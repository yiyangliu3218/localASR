[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localasr"
version = "0.1.0"
description = "Offline push-to-talk dictation for Apple Silicon Macs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.14"  # only tested against 3.13.7 so far
dependencies = [
    "sherpa-onnx>=1.10",  # SenseVoice engine + Silero VAD (CPU, any platform)
    "certifi",  # CA bundle for model downloads (python.org Python on macOS has none)
    "numpy",
    "sounddevice",
    "opencc-python-reimplemented",
    "pyobjc-framework-ApplicationServices",
    "pyobjc-framework-Cocoa",
    "pyobjc-framework-Quartz",
    "pyperclip",
    "rumps",
]

[project.optional-dependencies]
mlx = [
    "mlx-whisper",  # ENGINE = "mlx-whisper" (Apple Silicon only)
]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
localasr = "app:main"

[tool.setuptools]
py-modules = [
    "app",
    "audio_recorder",
    "config",
    "hotkey_listener",
    "model_download",
    "overlay",
    "segmenter",
    "text_output",
    "transcriber",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
